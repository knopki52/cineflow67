# Общая конфигурация для ВСЕХ сервисов. Раздаётся Spring Cloud Config Server.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

spring:
  datasource:
    username: cineflow
    password: cineflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA:localhost:29092}
    consumer:
      auto-offset-reset: earliest
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh,env,loggers,circuitbreakers,circuitbreakerevents,configprops
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

info:
  project: CineFlow
  description: Сеть кинотеатров на микросервисах Spring Cloud

logging:
  file:
    name: logs/${spring.application.name}.log
  pattern:
    level: "%5p [${spring.application.name}]"
  level:
    ru.cineflow: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  error:
    include-message: always
