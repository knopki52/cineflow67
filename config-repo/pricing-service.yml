spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/pricing_db

# Правила динамического ценообразования.
# Измените значение -> нажмите в админке «Обновить конфигурацию» -> цены на сайте изменятся без перезапуска.
pricing:
  banner: "Осенний марафон: −20% на всё по промокоду AUTUMN"
  round-to: 10
  center-coefficient: 1.3
  front-rows: 2
  front-rows-coefficient: 0.8
  morning-until-hour: 12
  morning-coefficient: 0.7
  evening-from-hour: 18
  weekend-evening-coefficient: 1.2
  occupancy-threshold: 0.7
  occupancy-coefficient: 1.2
