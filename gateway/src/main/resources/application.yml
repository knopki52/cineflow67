server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    # вся остальная конфигурация приходит из Spring Cloud Config Server (папка config-repo)
    import: "configserver:${CONFIG_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 40
        initial-interval: 2000
        max-interval: 5000
